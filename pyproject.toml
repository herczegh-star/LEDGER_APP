[project]
name = "ledger-app"
version = "1.0.0"
description = "Investiční portfolio tracker nad unified_format_raw"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.0",
    "flet>=0.25.0",
]

[project.scripts]
ledgerapp = "ledger_app.__main__:main"

[tool.setuptools.packages.find]
include = ["core*", "io_module*", "ui*", "cli*", "ledger_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/legacy", ".venv", "__pycache__", ".git"]
