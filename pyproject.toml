[project]
name = "ledger-app"
version = "0.2.0"
description = "Investiční portfolio tracker nad unified_format_raw"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.0",
    "flet>=0.25.0",
]

[project.scripts]
ledger-app = "cli:main"

[tool.setuptools]
py-modules = ["cli", "main"]

[tool.setuptools.packages.find]
include = ["core*", "io_module*", "ui*"]
